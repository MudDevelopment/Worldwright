{{- if not .Values.image.repository }}{{ fail "image.repository is required" }}{{ end }}
{{- if .Values.image.digest }}{{ if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}{{ fail "image.digest must be a lowercase sha256 digest" }}{{ end }}{{ else if not .Values.image.allowMutableTag }}{{ fail "image.digest is required unless image.allowMutableTag=true" }}{{ else if not .Values.image.tag }}{{ fail "image.tag is required for mutable images" }}{{ end }}
{{- if not .Values.publicOrigin }}{{ fail "publicOrigin is required" }}{{ end }}
{{- if not (regexMatch "^https://[^/?#]+$" .Values.publicOrigin) }}{{ fail "publicOrigin must be an exact HTTPS origin" }}{{ end }}
{{- if not .Values.ingress.enabled }}{{ fail "ingress.enabled must be true for this chart" }}{{ end }}
{{- if not .Values.ingress.host }}{{ fail "ingress.host is required" }}{{ end }}
{{- if ne .Values.publicOrigin (printf "https://%s" .Values.ingress.host) }}{{ fail "publicOrigin must equal https://ingress.host" }}{{ end }}
{{- if not .Values.ingress.tlsSecretName }}{{ fail "ingress.tlsSecretName is required" }}{{ end }}
{{- if not .Values.postgres.existingSecret }}{{ fail "postgres.existingSecret is required" }}{{ end }}
{{- if not .Values.postgres.key }}{{ fail "postgres.key is required" }}{{ end }}
{{- if not .Values.serviceAccount.create }}{{ if not .Values.serviceAccount.name }}{{ fail "serviceAccount.name is required when create=false" }}{{ end }}{{ end }}
{{- if .Values.oidc.enabled }}{{ if or (not (regexMatch "^https://[^/?#]+$" .Values.oidc.issuer)) (not (regexMatch "^https://[^/?#]+/api/v1/oidc/callback$" .Values.oidc.redirectUri)) (not .Values.oidc.clientId) (not .Values.oidc.existingSecret) (not .Values.oidc.key) }}{{ fail "OIDC fields must be valid and complete when enabled" }}{{ end }}{{ if ne .Values.oidc.redirectUri (printf "%s/api/v1/oidc/callback" .Values.publicOrigin) }}{{ fail "OIDC redirectUri must match publicOrigin callback" }}{{ end }}{{ end }}
{{- if .Values.networkPolicy.enabled }}{{ if or (not .Values.networkPolicy.postgresCidr) (not .Values.networkPolicy.namespaceSelector) (not .Values.networkPolicy.podSelector) }}{{ fail "network policy selectors and postgresCidr are required when enabled" }}{{ end }}{{ end }}
