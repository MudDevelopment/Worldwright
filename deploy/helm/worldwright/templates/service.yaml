apiVersion: v1
kind: Service
metadata:
  name: {{ include "worldwright.fullname" . }}
  labels: {{- include "worldwright.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ include "worldwright.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
