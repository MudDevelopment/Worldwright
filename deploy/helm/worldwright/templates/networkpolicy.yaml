apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worldwright.fullname" . }}
  labels: {{- include "worldwright.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "worldwright.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {{ toYaml .Values.networkPolicy.namespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.networkPolicy.podSelector | nindent 12 }}
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - ipBlock: { cidr: {{ required "networkPolicy.postgresCidr is required" .Values.networkPolicy.postgresCidr | quote }} }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector: {{ toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    {{- range .Values.networkPolicy.httpsEgressCidrs }}
    - to:
        - ipBlock: { cidr: {{ . | quote }} }
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
