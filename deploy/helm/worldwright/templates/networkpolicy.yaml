{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worldwright.fullname" . }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ include "worldwright.name" . }} } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {{ toYaml .Values.networkPolicy.namespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.networkPolicy.podSelector | nindent 12 }}
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ ipBlock: { cidr: {{ required "networkPolicy.postgresCidr is required" .Values.networkPolicy.postgresCidr | quote }} }}]
      ports: [{ protocol: TCP, port: 5432 }]
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }, { protocol: TCP, port: 443 }]
{{- end }}
