# Chart values format 2 is a deliberate fail-closed deployment change.
configVersion: 2
image:
  repository: ""
  digest: ""
  tag: ""
  allowMutableTag: false
imagePullSecrets: []
publicOrigin: ""
game: reference
serviceAccount:
  create: true
  name: ""
ingress:
  enabled: true
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}
postgres:
  existingSecret: ""
  migrationSecret: ""
  key: WORLDWRIGHT_DATABASE_URL
  migrationKey: WORLDWRIGHT_DATABASE_URL
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  redirectUri: ""
  existingSecret: ""
  key: WORLDWRIGHT_OIDC_CLIENT_SECRET
networkPolicy:
  enabled: true
  namespaceSelector: {}
  podSelector: {}
  postgresCidr: ""
  dnsNamespaceSelector:
    matchLabels: { kubernetes.io/metadata.name: kube-system }
  dnsPodSelector:
    matchLabels: { k8s-app: kube-dns }
  httpsEgressCidrs: []
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "2", memory: 1Gi }
