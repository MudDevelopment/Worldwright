name: Rust and P0/P1/P2 acceptance checks

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bootstrap Linux toolchain and dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/dev.sh bootstrap
      - name: Bootstrap Windows toolchain and dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev.ps1 bootstrap
      - name: Fresh native checks on Ubuntu
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/dev.sh scripts/desktop.sh deploy/helm/worldwright/tests/render.sh
          bash scripts/dev.sh check-native | tee "$RUNNER_TEMP/worldwright-native-check.log"
          target=$(sed -n 's/^Fresh native build directory (retained for diagnosis): //p' "$RUNNER_TEMP/worldwright-native-check.log")
          host=$(rustc -vV | sed -n 's/^host: //p')
          test -n "$target" && test -n "$host"
          printf 'WORLDWRIGHT_STUDIO_BIN=%s/%s/debug/worldwright-studio\n' "$target" "$host" >> "$GITHUB_ENV"
          printf 'WORLDWRIGHT_PREVIEW_BIN=%s/%s/debug/worldwright\n' "$target" "$host" >> "$GITHUB_ENV"
      - name: Fresh native checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev.ps1 check-native
      - name: Required P2 source, bundle and fixture drift checks
        shell: bash
        run: python scripts/test-p2-contracts.py
      - name: Required browser adapter lifecycle tests
        shell: bash
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
          node --check apps/worldwright-server/assets/app.js
          node --check apps/worldwright-studio/assets/app.js
          node scripts/test-expedition-browser.cjs
          node scripts/test-studio-capabilities.cjs
      - name: Real Ubuntu Studio first-run and game contract smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/test-desktop.py --real-studio "$WORLDWRIGHT_STUDIO_BIN" --real-preview "$WORLDWRIGHT_PREVIEW_BIN" -q
      - name: Ensure lockfile did not change
        shell: bash
        run: git diff --exit-code -- Cargo.lock

  helm-render:
    name: required Helm lint/render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Helm 3 acceptance tool
        # Dereferenced official Azure/setup-helm v4 tag and read action.yml.
        # Tooling pin is not a production-deployment security approval.
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.19.0
      - name: Required chart acceptance on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/worldwright-chart-venv"
          source "$RUNNER_TEMP/worldwright-chart-venv/bin/activate"
          python -m pip install -r deploy/helm/worldwright/tests/requirements.txt
          python -m unittest discover -s deploy/helm/worldwright/tests -p test_verify.py -v
          bash deploy/helm/worldwright/tests/render.sh
      - name: Required chart acceptance on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'worldwright-chart-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install -r deploy/helm/worldwright/tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'test dependency install failed' }
          & $python -m unittest discover -s deploy/helm/worldwright/tests -p test_verify.py -v
          if ($LASTEXITCODE -ne 0) { throw 'checker unit tests failed' }
          $env:PATH = (Join-Path $venv 'Scripts') + [IO.Path]::PathSeparator + $env:PATH
          ./deploy/helm/worldwright/tests/render.ps1

  gameplay-receipts:
    name: required PostgreSQL persistence and identity regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Disposable test service only; not the runtime deployment image policy.
        image: postgres:16
        env:
          POSTGRES_DB: worldwright_test_p0
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d worldwright_test_p0"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WORLDWRIGHT_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/worldwright_test_p0
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bootstrap pinned Rust dependencies
        shell: bash
        run: bash scripts/dev.sh bootstrap
      - name: Verify required tests exist and run every ignored database test
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p worldwright-persistence --locked --offline -- --ignored --list > "$RUNNER_TEMP/worldwright-db-tests.txt"
          for test in gameplay_browser_request_id_lifecycle timer_commit_fences_reconstructs_and_rolls_back_atomically oidc_link_concurrency_collision_revocation_and_restart session_retention_preserves_receipts_and_active_sessions; do
            grep -Fx "database_tests::$test: test" "$RUNNER_TEMP/worldwright-db-tests.txt"
          done
          cargo test -p worldwright-persistence --locked --offline -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/worldwright-db.log"
      - name: Retain database evidence on GitHub.com
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-regressions
          path: ${{ runner.temp }}/worldwright-db*
          retention-days: 14
          if-no-files-found: error
      - name: Retain database evidence on GitHub Enterprise
        if: always() && github.server_url != 'https://github.com'
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: database-regressions
          path: ${{ runner.temp }}/worldwright-db*
          retention-days: 14
          if-no-files-found: error
