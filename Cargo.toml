[workspace]
resolver = "3"
members = [
    "apps/worldwright",
    "apps/worldwright-server",
    "apps/worldwright-studio",
    "apps/worldwright-console",
    "apps/worldwright-load",
    "crates/worldwright-core",
    "crates/worldwright-content",
    "crates/worldwright-release",
    "crates/worldwright-operations",
    "crates/worldwright-protocol",
    "crates/worldwright-persistence",
    "crates/worldwright-sdk",
    "crates/worldwright-testkit",
    "crates/worldwright-expedition",
]

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.85"
publish = false
# Licensing has not been approved. Do not add a license grant by implication.
# After owner approval, add the selected license here and inherit it in members.

[workspace.dependencies]
worldwright-core = { path = "crates/worldwright-core", version = "=0.1.0-dev.0" }
worldwright-content = { path = "crates/worldwright-content", version = "=0.1.0-dev.0" }
worldwright-release = { path = "crates/worldwright-release", version = "=0.1.0-dev.0" }
worldwright-operations = { path = "crates/worldwright-operations", version = "=0.1.0-dev.0" }
worldwright-protocol = { path = "crates/worldwright-protocol", version = "=0.1.0-dev.0" }
worldwright-persistence = { path = "crates/worldwright-persistence", version = "=0.1.0-dev.0" }
worldwright-sdk = { path = "crates/worldwright-sdk", version = "=0.1.0-dev.0" }
worldwright-testkit = { path = "crates/worldwright-testkit", version = "=0.1.0-dev.0" }
worldwright-expedition = { path = "crates/worldwright-expedition", version = "=0.1.0-dev.0" }
# Registry dependencies enter alongside their first working integration.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_path_to_error = "=0.1.20"
argon2 = "=0.5.3"
axum = { version = "=0.8.6", features = ["ws"] }
futures-util = { version = "=0.3.31", features = ["sink"] }
getrandom = "=0.3.4"
rpassword = "=7.4.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
http-body-util = "=0.1.3"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tower = { version = "=0.5.2", features = ["util"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
uuid = "=1.18.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
async-trait = "=0.1.89"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.metadata.worldwright]
stage = "toolkit-maturity-implemented-with-local-evidence"
proposed-license = "MIT OR Apache-2.0"
license-approved = false
production-ready = false

[profile.release]
lto = "thin"
codegen-units = 1
